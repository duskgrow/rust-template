# Secret scan for PRs: added diff lines are matched against token /
# private-key / .env-assignment shapes; a hit hard-fails the check and
# annotates the offending line on the PR's Files tab. The same scan runs
# locally as a pre-commit hook over the staged diff (`pr-guard --staged`).
# Logic lives in xtask (just pr-guard); a separate workflow (like commits.yml)
# keeps this cheap check out of ci.yml's test matrix.
name: pr-guard

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-guard:
    name: pr guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gh pr diff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false # see the quality-gate job in ci.yml
      # target/ cache for the xtask compile; actions/cache over rust-cache for
      # the same reason as ci.yml (no `nix develop -c` key detection tax)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v0-rust-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v0-rust-${{ github.job }}-${{ runner.os }}-
      # the PR number travels via env var, never interpolated into shell
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: nix develop -c just pr-guard "$PR_NUMBER"
